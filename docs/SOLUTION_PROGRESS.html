<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Solution Progress</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1a1d23;
    --muted: #6b7280;
    --border: #e3e6ea;
    --accent: #2f6feb;
    --done: #1a8a4a;
    --pending: #d97706;
    --track: #e9ecef;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14161a;
      --panel: #1d2025;
      --text: #e7e9ec;
      --muted: #9aa1ac;
      --border: #2b2f36;
      --accent: #6ea1ff;
      --done: #3ecb7c;
      --pending: #e8a33d;
      --track: #2a2d33;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  .meta { color: var(--muted); font-size: 0.85rem; margin-bottom: 20px; }
  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; margin-bottom: 22px; }
  .stat-card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .stat-card .label { color: var(--muted); font-size: 0.75rem; text-transform: uppercase; letter-spacing: .04em; }
  .stat-card .value { font-size: 1.6rem; font-weight: 600; margin-top: 4px; }
  .bar {
    height: 8px;
    background: var(--track);
    border-radius: 999px;
    overflow: hidden;
    margin-top: 8px;
  }
  .bar > div { height: 100%; background: var(--accent); }
  .epics { margin-bottom: 22px; }
  .epic-row { display: grid; grid-template-columns: 220px 1fr 60px; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .epic-row .bar { margin-top: 0; }
  .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .controls input[type="search"] {
    flex: 1; min-width: 200px;
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.9rem;
  }
  .controls select {
    padding: 8px 12px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.9rem;
  }
  .count { color: var(--muted); font-size: 0.8rem; margin-left: auto; }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  th, td { text-align: left; padding: 8px 10px; font-size: 0.82rem; border-bottom: 1px solid var(--border); vertical-align: top; }
  th { color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 0.7rem; letter-spacing: .03em; }
  tr:last-child td { border-bottom: none; }
  .status-done { color: var(--done); font-weight: 600; }
  .status-pending { color: var(--pending); font-weight: 600; }
  .tag { display: inline-block; background: var(--track); border-radius: 5px; padding: 1px 6px; font-size: 0.72rem; margin-right: 3px; }
  .weight-pill { display: inline-block; min-width: 22px; text-align: center; background: var(--track); border-radius: 999px; padding: 1px 7px; font-size: 0.75rem; }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .container { max-width: 1100px; margin: 0 auto; }
  .table-wrap { overflow-x: auto; }
</style>
</head>
<body>
<div class="container">
  <h1>Solution Progress</h1>
  <div class="meta">Generated 2026-11-23 from docs/SOLUTION_TASKS.md (v0.14)</div>

  <div class="stats">
    <div class="stat-card">
      <div class="label">Completion (by weight)</div>
      <div class="value" id="statWeightPct">–</div>
      <div class="bar"><div id="statWeightBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">Completion (by task count)</div>
      <div class="value" id="statCountPct">–</div>
      <div class="bar"><div id="statCountBar" style="width:0%"></div></div>
    </div>
    <div class="stat-card">
      <div class="label">Tasks done / total</div>
      <div class="value" id="statTasks">–</div>
    </div>
    <div class="stat-card">
      <div class="label">Weight done / total</div>
      <div class="value" id="statWeight">–</div>
    </div>
  </div>

  <div class="epics" id="epicBreakdown"></div>

  <div class="controls">
    <input type="search" id="search" placeholder="Search by id, title, epic, feature, or surface…">
    <select id="statusFilter">
      <option value="all">All statuses</option>
      <option value="done">Completed only</option>
      <option value="pending">Not completed only</option>
    </select>
    <span class="count" id="resultCount"></span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>Status</th>
          <th>ID</th>
          <th>Surface</th>
          <th>Epic</th>
          <th>Feature</th>
          <th>Title</th>
          <th>Weight</th>
        </tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">No tasks match this filter.</div>
  </div>
</div>

nsion (extends done S-2.10.4; delivery order: (1) a markdown design spec under docs/design/, suggested name docs/design/cash-book-modal-spec.md, produced via the Team Lead / Frontend Developer flow, then (2) the Angular build, web only, mock data). Layout (described here; the user's reference screenshot is not stored in the repo): \"Cash Book\" modal; \"Created at\" date filter (default Today) with Filter and Reset; Export CSV and Export PDF (in-browser mock, as in payroll); buttons Add Actual Balance, Adjustment, Add OB. Ledger table (Description, Credit, Debit, Balance) with rows in order: Opening Balance, Total Expenses, Advance Salary, Employee Loan Settlement, Incomes, Invoices, Previous Invoices, Invoice Returns, GRNs, GRN Returns, Cash back, Adjustments, Cashbook Bank Deposit, then Balance, Actual Balance, Difference. ALL rows shown, backed by mock data even where no real module exists. \"Other Payment Invoices\" lists only Card and Online (Cash is in the ledger, Credit shown as credit sales; per OQ25, none of the reference's longer method list). \"Daily Sales Summary\": Sale Invoices, Invoice Returns, Discount, Tax, Unpaid Invoices. Permissions: only Admin can use Add Actual Balance, Adjustment and Add OB; all other roles view-only and may export. IN scope: the above, English labels, light and dark per the design system, single pharmacy, accessible dialog, empty-range zeros and invalid-date message. OUT of scope: Reload & Utility in any form (no Reload Commission row, no Provider TopUp row, no Add Reload Commission button; OQ29/A19 unchanged), Sinhala or other languages, real backend or real PDF/CSV services, non-PRD payment methods. Add Actual Balance/Adjustment/Difference semantics follow A36 until OQ38 is answered. Depends on S-2.10.4 (done).","weight":8,"weightDefaulted":false,"epic":"E-2 — ShopDesk back office frontend (Phase 1)","feature":"F-2.10 POS extras, Phase B (WEB)"},{"completed":true,"id":"S-2.10.7","surface":"WEB","title":"Counter Close redesign: shift summary, handover, BF, reconciliation panel. Rebuild the Counter Close dialog (S-2.10.5) as three columns with English + Sinhala labels: Shift Summary (Cashier, Register, Start Time, End Time, Total Sales, POS only) and Sales Breakdown (Opening Amount, Cash In, Cash Out, Net Total = expected cash, POS only; NO Reload Commission line, amount or button, OQ29 stays closed); Cash Count (Expected Cash banner, \"Count all cash in drawer\" field with calculator button, Cash Handover to Supervisor, BF Balance for Next Shift); Cash Reconciliation panel (empty until a count is entered, then Expected, Counted and Over, Short or Balanced with the difference); \"Complete Counter Close\" disabled with the hint \"Enter cash count to enable completion\" until a count is entered. IN scope: the dialog layout and fields above; keeping the closed-day lock, confirm step and printable report (AC-52 to AC-58) working, with the report extended to show handover, supervisor and BF if confirmed. OUT of scope: Reload & Utility in any form, multi-shift counters, app-wide Sinhala localization. Handover, BF, shift/register, calculator and Sinhala-text behaviour follow PRD assumptions A22 to A26 and are NOT final until the user answers OQ36 (the Team Lead should confirm OQ36 before planning). Sinhala text only from the reference screenshot; labels not in it need user-supplied text. Depends on S-2.10.5 (done).","weight":5,"weightDefaulted":false,"epic":"E-2 — ShopDesk back office frontend (Phase 1)","feature":"F-2.10 POS extras, Phase B (WEB)"},{"completed":true,"id":"S-2.10.9","surface":"API","title":"Update Products sync API (new backend scope, PRD 5.9.8): endpoint(s) that synchronise the product list with a server in batches and report total products, batch count and per-batch progress/status to the caller; validation and clear error responses for unreachable server, failed batch and empty list; role check per FR-POS-12. IN scope: the API and its tests. OUT of scope: the UI (S-2.10.10), the per-product quick edit (S-2.10.6, unchanged). Decided (OQ39 and OQ40 closed): two-way sync; server wins on conflict; NO authentication, for development only (A42; production auth is S-2.10.11); on a failed batch or unreachable server the sync stops and returns a clear message (A38). PO recommendations for user review (OQ41): fields = code/barcode (match key), name, category, unit, selling price, cost price, stock quantity, active status; server wins on all fields except stock, where app-only stock movements since the last sync (e.g. POS sales) are pushed first and the server's resulting stock is then pulled (A40); 500 products per batch, minimum one batch (A41); batches already applied stay applied and the error response lists succeeded and failed batches, and re-running is safe and never double-applies stock movements (A43); no result log or audit trail kept (A44). Acceptance: the API returns total products, batch count and per-batch status; a conflicting non-stock field ends with the server value; a POS sale made since the last sync is not lost; 389 products = 1 batch, 1,200 = 3 batches; a failed batch stops the run with an error response naming applied and failed batches. STILL OPEN (OQ41): the server/system to sync with is not named.","weight":8,"weightDefaulted":false,"epic":"E-2 — ShopDesk back office frontend (Phase 1)","feature":"F-2.10 POS extras, Phase B (WEB)"},{"completed":false,"id":"S-2.10.10","surface":"WEB","title":"Update Products sync flow (frontend, depends on S-2.10.9): the existing Update Products button on the POS bottom bar keeps opening the quick edit (S-2.10.6, must stay intact; no new bottom-bar button) and the quick edit screen gains a sync action (e.g. \"Update Products from server\") that starts the sync (OQ40-6 closed, A37); the action opens the confirmation dialog \"Are you sure? You want to update product list.\" with green Yes and grey Cancel (Cancel aborts, nothing runs), then a non-cancellable \"Update Products\" progress modal (recycle icon, progress bar, \"Total Products: N - x/y\" on the left, \"Processing\" with spinner on the right; batch counter counts up and the bar fills per batch; no close control, Esc ignored; auto-closes when done); on a failed batch or unreachable server the sync stops and an error message (listing applied and failed batches, A43) replaces the stuck modal (A38); the final counters stay visible until auto-close and nothing is shown or logged afterwards (A44, flagged for user confirmation, OQ41); accessible (focus trapped, progress announced), 52px controls, both themes. Reference: two user-supplied screens (confirmation dialog and progress modal), not stored in the repo; add them to docs/design/ under the names below.","weight":5,"weightDefaulted":false,"epic":"E-2 — ShopDesk back office frontend (Phase 1)","feature":"F-2.10 POS extras, Phase B (WEB)"},{"completed":false,"id":"S-2.10.11","surface":"API","title":"Add authentication to the Update Products sync API before production (A42). The sync API is built without authentication for development only; before any production release it must require a signed-in, authorised caller (role check per FR-POS-12) and the unauthenticated mode must be impossible to enable in production. IN scope: authentication and authorisation of the sync API and its tests. OUT of scope: the sync behaviour itself (S-2.10.9) and the UI. Mechanism and server identity open (OQ41); depends on S-2.10.9. Release blocker for production. (v0.13: superseded in scope by S-3.5.2, which enforces the same for the whole API; tick this story when S-3.5.2 is accepted.)","weight":5,"weightDefaulted":false,"epic":"E-2 — ShopDesk back office frontend (Phase 1)","feature":"F-2.10 POS extras, Phase B (WEB)"},{"completed":true,"id":"S-2.11.1","surface":"WEB","title":"Billing screen surfaces and soft colour-coded secondary buttons, light and dark: muted grey page background and a slightly darker panel around the line items (token based, both themes); second function render() {
  const search = document.getElementById('search').value.trim().toLowerCase();
  const status = document.getElementById('statusFilter').value;

  const filtered = TASKS.filter(t => {
    if (status === 'done' && !t.completed) return false;
    if (status === 'pending' && t.completed) return false;
    if (!search) return true;
    const hay = (t.id + ' ' + t.title + ' ' + t.epic + ' ' + t.feature + ' ' + t.surface).toLowerCase();
    return hay.includes(search);
  });

  const rowsEl = document.getElementById('rows');
  rowsEl.innerHTML = filtered.map(t => `
    <tr>
      <td class="${t.completed ? 'status-done' : 'status-pending'}">${t.completed ? '✓ Done' : '○ Pending'}</td>
      <td>${t.id}</td>
      <td>${t.surface.split('/').map(s => `<span class="tag">${s}</span>`).join('')}</td>
      <td>${t.epic}</td>
      <td>${t.feature}</td>
      <td>${t.title}</td>
      <td><span class="weight-pill">${t.weight}${t.weightDefaulted ? '*' : ''}</span></td>
    </tr>
  `).join('');

  document.getElementById('emptyState').style.display = filtered.length ? 'none' : 'block';
  document.getElementById('resultCount').textContent = filtered.length + ' of ' + TASKS.length + ' tasks';
}

function computeStats() {
  const totalTasks = TASKS.length;
  const doneTasks = TASKS.filter(t => t.completed).length;
  const totalWeight = TASKS.reduce((s, t) => s + t.weight, 0);
  const doneWeight = TASKS.filter(t => t.completed).reduce((s, t) => s + t.weight, 0);

  const weightPct = totalWeight ? Math.round((doneWeight / totalWeight) * 100) : 0;
  const countPct = totalTasks ? Math.round((doneTasks / totalTasks) * 100) : 0;

  document.getElementById('statWeightPct').textContent = weightPct + '%';
  document.getElementById('statWeightBar').style.width = weightPct + '%';
  document.getElementById('statCountPct').textContent = countPct + '%';
  document.getElementById('statCountBar').style.width = countPct + '%';
  document.getElementById('statTasks').textContent = doneTasks + ' / ' + totalTasks;
  document.getElementById('statWeight').textContent = doneWeight + ' / ' + totalWeight;

  const epics = {};
  TASKS.forEach(t => {
    if (!epics[t.epic]) epics[t.epic] = { done: 0, total: 0 };
    epics[t.epic].total += t.weight;
    if (t.completed) epics[t.epic].done += t.weight;
  });

  const epicEl = document.getElementById('epicBreakdown');
  epicEl.innerHTML = Object.keys(epics).map(name => {
    const e = epics[name];
    const pct = e.total ? Math.round((e.done / e.total) * 100) : 0;
    return `<div class="epic-row">
      <div>${name}</div>
      <div class="bar"><div style="width:${pct}%"></div></div>
      <div>${pct}%</div>
    </div>`;
  }).join('');
}

document.getElementById('search').addEventListener('input', render);
document.getElementById('statusFilter').addEventListener('change', render);

computeStats();
render();
</script>
</body>
</html>
