name: Backend CI

on:
  push:
    paths:
      - 'backend-app/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    paths:
      - 'backend-app/**'
      - '.github/workflows/backend-ci.yml'

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-app/package-lock.json
      - run: npm ci
      - run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # Same suites against a real, throwaway PostgreSQL through Prisma (applies the committed migration).
      - run: npm run test:pg
      # Prisma 7.10.1 plus an `effect` override (see package.json) leaves zero known vulnerabilities; block High and above.
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build
