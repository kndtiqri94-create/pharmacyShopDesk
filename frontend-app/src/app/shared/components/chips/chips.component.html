<div class="chips" role="group" [attr.aria-label]="ariaLabel()">
  @for (item of items(); track item.id) {
    <button
      type="button"
      class="chip"
      [attr.aria-pressed]="item.id === value()"
      [class.chip--active]="item.id === value()"
      (click)="select(item.id)"
    >
      {{ item.label }}
      @if (item.count !== undefined) {
        <span class="chip__count">{{ formatCount(item.count) }}</span>
      }
    </button>
  }
</div>
