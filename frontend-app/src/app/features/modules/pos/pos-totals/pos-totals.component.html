<div class="totals">
  <div class="totals__box" data-testid="summary-box">
    <dl class="totals__list">
      <div class="totals__row">
        <dt>No. of Items</dt>
        <dd class="sd-num" data-testid="item-count">
          {{ count(posService.totals().itemCount) }} / {{ count(totalQuantity()) }}
        </dd>
      </div>
    </dl>
    <hr class="totals__divider" />
    <dl class="totals__list">
      <div class="totals__row totals__row--strong">
        <dt>Sub Total</dt>
        <dd class="sd-num" data-testid="sub-total">
          {{ money(posService.totals().subTotalCents) }}
        </dd>
      </div>
    </dl>
    <div class="sd-form-grid">
      <app-field
        label="Discount (Rs.)"
        fieldId="pos-discount-amount"
        prefix="Rs."
        size="xl"
        [span]="6"
      >
        <input
          appFieldControl
          class="totals__input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          [attr.maxlength]="amountMaxLength"
          [value]="discountAmountText()"
          [disabled]="!discountEditable()"
          (change)="onAmountChange($event)"
        />
      </app-field>
      <app-field
        label="Discount (%)"
        fieldId="pos-discount-percent"
        suffix="%"
        size="xl"
        [span]="6"
      >
        <input
          appFieldControl
          class="totals__input"
          type="text"
          inputmode="decimal"
          autocomplete="off"
          [attr.maxlength]="percentMaxLength"
          [value]="discountPercentText()"
          [disabled]="!discountEditable()"
          (change)="onPercentChange($event)"
        />
      </app-field>
    </div>
  </div>

  @if (posService.discountProblem(); as problem) {
    <app-alert tone="warning">{{ problem }}</app-alert>
  }

  <dl class="totals__list">
    <div class="totals__row totals__row--total">
      <dt>Total</dt>
      <dd class="totals__total" data-testid="total">{{ money(posService.totals().totalCents) }}</dd>
    </div>
  </dl>
</div>
