<div class="actions" role="group" aria-label="Bill actions">
  <div class="actions__item actions__item--wide">
    <app-button
      size="xl"
      icon="printer"
      tone="green"
      [block]="true"
      [disabled]="!posService.canSell() || posService.working()"
      (click)="saveAndPrintRequested.emit()"
    >
      Save &amp; Print <kbd class="actions__key">{{ keys.SAVE_AND_PRINT }}</kbd>
    </app-button>
  </div>
  <div class="actions__grid">
    <div class="actions__item">
      <app-button
        size="xl"
        icon="check"
        tone="purple"
        [block]="true"
        [disabled]="!posService.canSell() || posService.working()"
        (click)="saveRequested.emit()"
      >
        Save <kbd class="actions__key">{{ keys.SAVE }}</kbd>
      </app-button>
    </div>
    <div class="actions__item">
      <app-button
        size="xl"
        icon="pause"
        tone="amber"
        [block]="true"
        [disabled]="!posService.canSell() || posService.working()"
        (click)="holdRequested.emit()"
      >
        Hold <kbd class="actions__key">{{ keys.HOLD }}</kbd>
      </app-button>
    </div>
    <div class="actions__item">
      <app-button
        size="xl"
        icon="clipboard"
        tone="muted"
        [block]="true"
        [disabled]="!posService.canSell() || posService.working()"
        (click)="saveQuotationRequested.emit()"
      >
        Save Quotation <kbd class="actions__key">{{ keys.SAVE_QUOTATION }}</kbd>
      </app-button>
    </div>
    <div class="actions__item">
      <app-button
        size="xl"
        icon="plus"
        tone="slate"
        [block]="true"
        [disabled]="posService.working()"
        (click)="newBillRequested.emit()"
      >
        New <kbd class="actions__key">{{ keys.NEW_BILL }}</kbd>
      </app-button>
    </div>
  </div>
  <app-button
    size="xl"
    icon="clipboard"
    tone="blue"
    [block]="true"
    [disabled]="posService.working()"
    (click)="heldBillsRequested.emit()"
  >
    Held bills ({{ posService.heldBills().length }})
  </app-button>
</div>
