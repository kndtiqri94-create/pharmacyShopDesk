<dialog
  #dialog
  class="pos-dialog"
  [attr.data-size]="size()"
  [attr.aria-labelledby]="titleId"
  (cancel)="onCancel($event)"
>
  <div class="pos-dialog__surface">
    <header class="pos-dialog__header">
      <h2 class="sd-section-title" [id]="titleId">{{ heading() }}</h2>
      <app-button size="xl" icon="x" ariaLabel="Close" (click)="closed.emit()" />
    </header>
    <div class="pos-dialog__body">
      <ng-content />
    </div>
    <footer class="pos-dialog__footer">
      <ng-content select="[dialogActions]" />
    </footer>
  </div>
</dialog>
