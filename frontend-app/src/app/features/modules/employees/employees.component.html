<div class="sd-stack">
  <app-page-header title="Employees" [subtitle]="subtitle()">
    @if (canViewPayroll()) {
      <div pageActions class="sd-row">
        <app-button (click)="openPayroll()">Payroll</app-button>
      </div>
    }
  </app-page-header>

  @if (summary(); as summary) {
    <app-employee-tiles [summary]="summary" />
  }

  <app-tabs
    ariaLabel="Employee sections"
    [items]="tabItems()"
    [value]="tab()"
    [panelId]="panelId"
    (valueChange)="setTab($event)"
  />

  <div class="sd-stack" role="tabpanel" [id]="panelId">
    @switch (tab()) {
      @case ('attendance') {
        <app-attendance-table [rows]="attendanceRows()" />
      }
      @case ('leave') {
        <div class="sd-row" *appCanWrite="employeesModule">
          <app-button variant="primary" icon="plus" (click)="applyForLeave()">
            Apply for leave
          </app-button>
        </div>
        <app-leave-requests
          [requests]="leaveRequests()"
          [employees]="employees()"
          [users]="users()"
          [types]="leaveTypes()"
          (changed)="reload()"
        />
      }
      @default {
        <app-employee-list
          [employees]="employees()"
          [users]="users()"
          [onLeaveIds]="onLeaveIds()"
          (changed)="reload()"
        />
        <app-todays-attendance-card
          [rows]="attendanceRows()"
          (markAttendance)="showSampleMessage('Mark attendance')"
        />
      }
    }
  </div>
</div>
