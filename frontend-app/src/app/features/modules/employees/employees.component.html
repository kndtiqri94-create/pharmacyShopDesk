<div class="sd-stack">
  <app-page-header title="Employees" [subtitle]="subtitle()" />

  @if (summary(); as summary) {
    <app-employee-tiles [summary]="summary" />
  }

  <app-tabs
    ariaLabel="Employee sections"
    [items]="tabItems()"
    [value]="tab()"
    [panelId]="panelId"
    (valueChange)="setTab($event)"
  />

  <div class="sd-stack" role="tabpanel" [id]="panelId">
    @switch (tab()) {
      @case ('attendance') {
        <app-attendance-table [rows]="attendanceRows()" />
      }
      @case ('leave') {
        <app-leave-table [rows]="leaveRows()" />
      }
      @default {
        <app-employee-list [employees]="employees()" [users]="users()" (changed)="reload()" />
        <app-todays-attendance-card
          [rows]="attendanceRows()"
          (markAttendance)="showSampleMessage('Mark attendance')"
        />
      }
    }
  </div>
</div>
