<button
  #trigger
  type="button"
  class="trigger"
  aria-haspopup="menu"
  [attr.aria-expanded]="open()"
  [attr.aria-controls]="open() ? menuId : null"
  [attr.aria-label]="'Actions for ' + employeeName()"
  (click)="toggle()"
>
  <app-icon name="more" />
</button>
@if (open()) {
  <div
    class="menu"
    role="menu"
    tabindex="-1"
    [id]="menuId"
    [attr.aria-label]="'Actions for ' + employeeName()"
    [style.top]="position()['top']"
    [style.bottom]="position()['bottom']"
    [style.right]="position()['right']"
    (keydown)="onMenuKey($event)"
  >
    @for (item of items; track item.id) {
      <button type="button" class="menu__item" role="menuitem" (click)="choose(item.id)">
        <app-icon [name]="item.icon" />
        {{ item.label }}
      </button>
    }
  </div>
}
