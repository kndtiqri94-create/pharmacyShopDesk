<app-confirm-dialog
  title="Create Nopay Amount"
  confirmLabel="Save"
  [open]="true"
  [busy]="working()"
  (confirmed)="save()"
  (cancelled)="cancel()"
>
  <p class="employee sd-body-strong">{{ row().employee.name }}</p>
  @if (formError(); as message) {
    <p class="form-error" role="alert" data-testid="form-error">{{ message }}</p>
  }
  <app-field label="Date" [fieldId]="fieldIds.date" [required]="true" [error]="error('date')">
    <input appFieldControl type="date" [value]="date()" (input)="onDate($event)" />
  </app-field>
  <app-field
    label="Amount"
    prefix="Rs."
    [fieldId]="fieldIds.amount"
    [required]="true"
    [error]="error('amount')"
  >
    <input
      appFieldControl
      type="text"
      inputmode="decimal"
      autocomplete="off"
      placeholder="Enter Amount"
      [value]="amount()"
      (input)="onAmount($event)"
    />
  </app-field>
  <app-field
    label="Reason"
    [fieldId]="fieldIds.reason"
    [required]="true"
    [error]="error('reason')"
    [hint]="reason().length + ' of ' + reasonMax + ' characters'"
  >
    <textarea
      appFieldControl
      rows="3"
      [attr.maxlength]="reasonMax"
      [value]="reason()"
      (input)="onReason($event)"
    ></textarea>
  </app-field>
</app-confirm-dialog>
