<div class="sd-stack">
  <app-page-header [title]="heading()" [subtitle]="subtitle()" />
  <app-card>
    <app-empty-state [title]="emptyTitle()" [message]="message()">
      @if (hasDestination()) {
        <app-button variant="primary" (click)="goToFirstModule()"
          >Go to a page you can use</app-button
        >
      }
    </app-empty-state>
  </app-card>
</div>
